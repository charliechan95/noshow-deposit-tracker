{% extends "base.html" %}
{% block title %}Appointments — Deposit Tracker{% endblock %}
{% block content %}
<h1>Appointments</h1>

<div class="toolbar">
  <form method="get" class="search" id="filter-form">
    <input type="text" id="f-q" placeholder="Search customer…">
    <select id="f-deposit">
      <option value="">All deposits</option>
      {% for s, label in deposit_statuses %}
      <option value="{{ s }}">{{ label }}</option>
      {% endfor %}
    </select>
    <select id="f-appt">
      <option value="">All statuses</option>
      {% for s, label in appt_statuses %}
      <option value="{{ s }}">{{ label }}</option>
      {% endfor %}
    </select>
    <button type="submit">Filter</button>
  </form>
  <button id="btn-new-appt" class="primary">+ New appointment</button>
</div>

<table class="tbl">
  <thead><tr>
    <th>Customer</th><th>Service</th><th>Date</th>
    <th>Deposit</th><th>Appt</th><th></th>
  </tr></thead>
  <tbody id="appt-rows">
    <tr><td colspan="6" class="muted">Loading…</td></tr>
  </tbody>
</table>

<dialog id="dlg-appt">
  <form method="dialog" id="frm-appt">
    <h2>New appointment</h2>
    <label>Customer name <input name="customer_name" required></label>
    <label>Phone (with country code, e.g. 85291234567)
      <input name="customer_phone" required></label>
    <label>Service <input name="service"
           placeholder="e.g. Haircut + Colour"></label>
    <label>Date <input type="date" name="appt_date" required></label>
    <label>Time <input type="time" name="appt_time"></label>
    <label>Deposit amount <input type="number" step="1" min="0"
           name="deposit_amount" id="f-deposit-amt"></label>
    <label>Currency <input name="currency" value="HKD" maxlength="3"></label>
    <label>Notes <textarea name="notes" rows="2"></textarea></label>
    <div class="dlg-actions">
      <button type="submit" class="primary">Save</button>
      <button type="button" id="btn-cancel-appt">Cancel</button>
    </div>
  </form>
</dialog>
{% endblock %}
